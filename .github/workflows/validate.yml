name: Validate SpeciesNet package

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch lightweight LFS manifests
        run: git lfs pull --include="config.json,models/*/config.json" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q distill tests
      - name: Validate canonical and backend manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = json.loads(Path("config.json").read_text())
          assert root["model"] == "resnet"
          assert root["input_shape"] == [1, 3, 480, 480]
          assert len(root["labels"]) == 2498
          assert set(root["backends"]) == {"coreml", "ncnn", "onnx", "openvino"}
          assert root["files"][0] == "models/ncnn/speciesnet-v4.0.3a.ncnn.bin"
          assert len(root["files"]) == 8
          for backend, metadata in root["backends"].items():
              config = json.loads((Path("models") / backend / "config.json").read_text())
              assert config["model"] == root["model"]
              assert config["input_shape"] == root["input_shape"]
              assert config["labels"] == root["labels"]
              assert config["files"] == metadata["files"]
          PY
