name: Validate species model pipeline

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow==11.3.0 numpy==2.2.6
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q distill tests
      - name: Validate Scrypted configs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('species/north-carolina.json').read_text())
          assert len(catalog['species']) >= 500
          assert catalog['labels'][-1] == 'unknown'
          assert len(catalog['labels']) == len(catalog['species']) + 1
          assert len(set(catalog['labels'])) == len(catalog['labels'])
          expected_files = {
              'onnx': ['north-carolina-wildlife.onnx'],
              'openvino': ['north-carolina-wildlife.xml', 'north-carolina-wildlife.bin'],
              'coreml': [
                  'north-carolina-wildlife.mlpackage/Data/com.apple.CoreML/model.mlmodel',
                  'north-carolina-wildlife.mlpackage/Data/com.apple.CoreML/weights/weight.bin',
                  'north-carolina-wildlife.mlpackage/Manifest.json',
              ],
              'ncnn': ['north-carolina-wildlife.ncnn.param', 'north-carolina-wildlife.ncnn.bin'],
          }
          root_config = json.loads(Path('config.json').read_text())
          assert root_config['model'] == 'yolov9'
          assert root_config['input_shape'] == [1, 3, 640, 640]
          assert list(root_config['labels'].values()) == catalog['labels']
          assert {key: value['files'] for key, value in root_config['backends'].items()} == expected_files
          for backend, files in expected_files.items():
              config_path = Path('models') / backend / 'config.json'
              config = json.loads(config_path.read_text())
              assert config['model'] == 'yolov9'
              assert config['input_shape'] == [1, 3, 640, 640]
              assert config['files'] == files
              assert list(config['labels'].values()) == catalog['labels']
              for key in ('model', 'input_shape', 'labels'):
                  assert config[key] == root_config[key]
          PY
